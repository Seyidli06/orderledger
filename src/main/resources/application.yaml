  spring:
    application:
      name: orderledger

    datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/orderledger}
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: ${JPA_SHOW_SQL:false}
      properties:
        hibernate:
          format_sql: ${HIBERNATE_FORMAT_SQL:false}

    flyway:
      enabled: true
      baseline-on-migrate: true
      baseline-version: "1"

  springdoc:
    api-docs:
      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html

